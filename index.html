<!DOCTYPE html>
<html>
<head>
<style>
body { background: #1a1a1a; color: #0f0; font-family: monospace; padding: 20px; }
button { background: #333; color: #0f0; border: 1px solid #0f0; padding: 10px; margin: 5px; cursor: pointer; }
input { background: #000; color: #0f0; border: 1px solid #333; padding: 5px; margin: 5px; width: 150px; }
#log { background: #000; border: 1px solid #333; height: 200px; overflow-y: scroll; padding: 10px; margin-top: 20px; white-space: pre-wrap; }
.group { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
</style>
</head>
<body>
<h1>GHOST CONSOLE v3 (STABLE)</h1>
<div id="status">System Status: INITIALIZING...</div>

<div class="group">
  <h3>Lag All Players</h3>
  <input id="lagDur" type="number" value="5">
  <button onclick="execAction('lagAll')">EXECUTE LAG ALL</button>
</div>

<div class="group">
  <h3>Kick Player</h3>
  <input id="kickId" placeholder="Player ID (e.g., 1)" type="number">
  <input id="kickMsg" placeholder="Reason" value="Suck my Nuts Bitch">
  <button onclick="execAction('kick')">EXECUTE KICK</button>
</div>

<div id="log"></div>

<script>
const BRIDGE_URL = 'https://ghost-bridge-5626.onrender.com';
const TOKEN = 'GHOST_2025';

function log(msg) {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    el.innerHTML += `[${time}] ${msg}<br>`;
    el.scrollTop = el.scrollHeight;
}

function execAction(action) {
    let body = { action: action };

    if (action === 'lagAll') {
        body.duration = parseInt(document.getElementById('lagDur').value) || 5;
    } else if (action === 'kick') {
        const rawId = document.getElementById('kickId').value;
        body.targetId = parseInt(rawId, 10);
        body.kickMsg = document.getElementById('kickMsg').value || "Suck my Nuts Bitch";
        if (isNaN(body.targetId)) return log("ERROR: Invalid Player ID", true);
    }

    fetch(`${BRIDGE_URL}/api/exec`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Ghost-Token': TOKEN },
        body: JSON.stringify(body)
    }).then(r => r.json()).then(d => {
        log(`RESPONSE: ${JSON.stringify(d)}`);
    }).catch(e => log(`ERROR: ${e.message}`));
}

setInterval(() => {
    // Just check if bridge is up
    fetch(`${BRIDGE_URL}/`, { method: 'HEAD' }).then(() => {
        document.getElementById('status').innerText = "System Status: LINK ACTIVE";
    }).catch(() => {
        document.getElementById('status').innerText = "System Status: CONNECTION LOST";
    });
}, 5000);
</script>
</body>
</html>
